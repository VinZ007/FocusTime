<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="account.css">
</head>
<body>

    <button class="backbtn" onclick="window.location.href='Productivity_Gainer.html'">
        <i class="bi bi-box-arrow-left"></i> <span data-tt="backToMain">Back To Main</span>
    </button>

    <!-- Переключатель языка: фиксирован в правом верхнем углу, зеркально .backbtn -->
    <button class="backbtn lang-btn" id="langToggleBtn" type="button">Русский</button>

    <div class="container">

        <article class="profile-card">
            <header class="profile-banner" id="bannerContainer">

            </header>

            <div class="profile-header">
                <figure class="avatar-container">
                    <img id="avatarImage" src="" alt="Avatar">
                    <button class="avatar-upload-btn" onclick="document.getElementById('avatarInput').click()"><i
                            class="bi bi-camera"></i></button>
                    <input type="file" id="avatarInput" accept="image/*">
                </figure>
            </div>

            <section class="profile-info">
                <h1 class="profile-name" id="username">Loading...</h1>
                <p class="profile-email" id="email">Loading...</p>

                <section class="profile-bio">
                    <div id="bioDisplay">
                        <!-- data-empty="true" — в блоке показан плейсхолдер (он переводится), а не текст пользователя -->
                        <p class="bio-text" id="bioText" data-empty="true">Tell us about yourself...</p>
                        <button class="edit-bio-btn" onclick="toggleBioEdit()">
                            <i class="bi bi-pencil"></i> <span data-tt="editBio">Edit</span>
                        </button>
                    </div>
                    <div id="bioEdit">
                        <textarea class="bio-textarea" id="bioTextarea" data-tt-placeholder="bioPlaceholder"
                            placeholder="Tell us about yourself..." maxlength="500"></textarea>
                        <div class="bio-actions">
                            <button class="edit-bio-btn bio-save-btn" onclick="saveBio()">
                                <i class="bi bi-check-lg"></i> <span data-tt="saveBtn">Save</span>
                            </button>
                            <button class="edit-bio-btn" onclick="cancelBioEdit()">
                                <i class="bi bi-x-lg"></i> <span data-tt="cancelBtn">Cancel</span>
                            </button>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">
                        <i class="bi bi-graph-up"></i> <span data-tt="statsTitle">Activity Statistics</span>
                    </h2>

                    <h3 data-tt="productiveGainer">Productive Gainer:</h3>
                    <div class="stats-grid">
                        <article class="stat-card">
                            <div class="stat-card-emoji">🌼</div>
                            <h3 class="stat-card-label">Narcissus</h3>
                            <p id="narcissusTime" class="stat-card-value stat-card-value--green">0:00</p>
                        </article>
                        <article class="stat-card">
                            <div class="stat-card-emoji">🌊</div>
                            <h3 class="stat-card-label">Sea Stones</h3>
                            <p id="seastonesTime" class="stat-card-value stat-card-value--blue">0:00</p>
                        </article>
                        <article class="stat-card">
                            <div class="stat-card-emoji">🧑🏻</div>
                            <h3 class="stat-card-label">Running Guy</h3>
                            <p id="runningTime" class="stat-card-value stat-card-value--orange">0:00</p>
                        </article>
                        <article class="stat-card">
                            <div class="stat-card-emoji">✅</div>
                            <h3 class="stat-card-label" data-tt="totalSessions">Total sessions</h3>
                            <p id="totalSessions" class="stat-card-value stat-card-value--lime">0</p>
                        </article>
                    </div>
                </section>
            </section>
        </article>
    </div>
    <div id="message" class="message" style="display: none;"></div>

    <script src="auth.js"></script>
    <script src="account.js"></script>

</body>
</html>
